name: CLI tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-test:
    name: CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run append tests
        run: sh tests/append/tests.sh
      - name: Run version test
        run: sh tests/test_version.sh
